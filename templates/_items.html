{% macro entries(items) %}
  {% if items %}
  <ul class="list">
    {% for item in items %}
    <li>
      <a href="{{ url_for('read', item_id=item.id) }}">{{ item.title }}</a>
      <small>Open in reader</small>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">Nothing here yet.</p>
  {% endif %}
{% endmacro %}
