{% extends "base.html" %}
{% from "_items.html" import entries %}
{% block content %}
{% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}

<section aria-labelledby="continue">
  <h2 id="continue">Continue Reading</h2>
  <p class="empty">Nothing yet. Your last story will appear here.</p>
</section>

<section id="stories" aria-labelledby="stories-h">
  <h2 id="stories-h"><a href="{{ url_for('stories') }}">Stories</a></h2>
  {{ entries(stories) }}
</section>

<section id="parvas" aria-labelledby="parvas-h">
  <h2 id="parvas-h"><a href="{{ url_for('parvas') }}">Parvas</a></h2>
  {{ entries(parvas) }}
</section>
{% endblock %}
