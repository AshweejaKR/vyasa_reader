<!doctype html>
<html lang="kn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vyasa Reader{% endblock %}</title>
  <meta name="theme-color" content="#8a2a00">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head_extra %}{% endblock %}
  <script src="{{ url_for('static', filename='resume.js') }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <h1><a href="{{ url_for('home') }}">ವ್ಯಾಸ ರೀಡರ್ <span>Vyasa Reader</span></a></h1>
    <p>An independent Kannada Mahabharata reader. Not an official VyasaOnline app.</p>
    <nav aria-label="Main">
      <a href="{{ url_for('stories') }}">Stories</a>
      <a href="{{ url_for('parvas') }}">Parvas</a>
    </nav>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer>Story text belongs to its original source; entries here link to the original site.</footer>
</body>
</html>
